name: 上游漂移报告

# 每周把「本项目依赖、但没有修改」的上游路径过一遍，有变化就开/更新一个 issue。
#
# 为什么需要：git rebase 只在「上游改了 ∩ 我也改了」时报冲突，而本项目九成内容
# 是往树里新增文件，它们依赖的上游文件我们一行没碰 —— 那些地方上游怎么改，
# rebase 都不会吭声。25.12 线「编得过、刷上去没网、日志无声」就是这么来的。
#
# 本流程刻意不改 upstream.lock：自动 bump 等于没有基线。它只负责告诉你该看哪里。

on:
  schedule:
    # 每周一 09:00 北京时间（UTC 01:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout(检出本仓库)
        uses: actions/checkout@v4

      - name: Cache upstream mirror(缓存上游镜像)
        uses: actions/cache@v4
        with:
          path: .drift-cache
          # 缓存里是个 blob-less 的部分克隆，只存提交与树，几十兆。
          # key 带上 lock 的哈希：改了基线就重新建，免得比对用的历史不全。
          key: drift-cache-${{ hashFiles('upstream.lock') }}
          restore-keys: drift-cache-

      - name: Run drift check(跑漂移检查)
        id: check
        run: |
          set +e
          bash scripts/check-drift.sh watch > drift-report.txt 2>&1
          echo "rc=$?" >> $GITHUB_OUTPUT
          cat drift-report.txt

      - name: Report(开或更新 issue)
        if: steps.check.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="上游漂移报告"
          BODY_FILE=body.md
          {
            echo "> 由 [\`upstream-drift.yml\`](../blob/main/.github/workflows/upstream-drift.yml) 于 $(date -u '+%Y-%m-%d %H:%M UTC') 自动生成。"
            echo "> 这是**提醒**不是报错：列出的路径本项目依赖但没有修改，"
            echo "> \`git rebase\` 对它们的变化不会有任何提示。"
            echo
            echo '```'
            cat drift-report.txt
            echo '```'
            echo
            echo "跟进方式见 [\`docs/upstream-drift.md\`](../blob/main/docs/upstream-drift.md)。"
            echo "确认没问题、并且 rebase 后实机验证过，再手工更新 \`upstream.lock\`。"
          } > "$BODY_FILE"

          NUM=$(gh issue list --label upstream-drift --state open \
                  --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            # 只保留一个常开 issue，每周覆盖正文，避免每周开一个把列表刷满
            gh issue edit "$NUM" --body-file "$BODY_FILE"
            gh issue comment "$NUM" --body "已刷新为 $(date -u '+%Y-%m-%d') 的报告。"
            echo "::notice::已更新 issue #$NUM"
          else
            gh label create upstream-drift --color BFD4F2 \
              --description "上游改动了本项目依赖的路径" 2>/dev/null || true
            gh issue create --title "$TITLE" --label upstream-drift --body-file "$BODY_FILE"
            echo "::notice::已新建漂移报告 issue"
          fi

      - name: Close stale issue(上游没动就关掉)
        if: steps.check.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --label upstream-drift --state open \
                  --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "盯梢清单上的路径当前无变化，自动关闭。"
          fi

      - name: Fail on error(脚本本身出错才算失败)
        if: steps.check.outputs.rc != '0' && steps.check.outputs.rc != '1'
        run: |
          echo "::error::check-drift.sh 退出码 ${{ steps.check.outputs.rc }}（用法或环境错误）"
          exit 1
